<div class="gitlab-mr-header op-tab-content--header">
  <svg op-gitlab-merge-request-open-icon size="small"></svg>
  <h3 class="title">
    {{text.title}}
  </h3>
  <ul class="toolbar-items hide-when-print">
    <li class="toolbar-item" *ngIf="isGitlabConfigured">
      <div class="gitlab-split-button">
        <button class="button gitlab-split-button--main"
            type="button"
            [attr.aria-label]="text.createMrButtonDescription"
            [disabled]="isCreatingMr"
            (click)="createMergeRequest()">
          <op-icon icon-classes="button--icon icon-add" />
          <span class="button--text"
                [textContent]="isCreatingMr ? text.createMrLoading : text.createMrButtonLabel"
                aria-hidden="true"></span>
          <span class="gitlab-split-button--divider"></span>
          <span class="gitlab-split-button--toggle"
                [attr.aria-label]="text.toggleLinkTypeDescription"
                [attr.title]="linkType === 'private' ? text.privateLink : text.publicLink"
                (click)="toggleLinkType($event)">
            <svg eye-icon size="small" *ngIf="linkType === 'public'"></svg>
            <svg eye-closed-icon size="small" *ngIf="linkType === 'private'"></svg>
          </span>
        </button>
      </div>
    </li>
    <li class="toolbar-item">
      <button class="button gitlab-git-copy"
          type="button"
          [attr.aria-label]="text.gitMenuDescription"
          gitActionsCopyDropdown
          [gitActionsCopyDropdown-workPackage]="workPackage">
        <op-icon icon-classes="button--icon icon-console-light" />
        <span class="button--text"
              [textContent]="text.gitMenuLabel"
              aria-hidden="true"></span>
        <op-icon icon-classes="button--icon icon-small icon-pulldown hidden-for-mobile" />
      </button>
    </li>
  </ul>
</div>
