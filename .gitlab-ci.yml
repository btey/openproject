schedule:ldap_sync:
  stage: ldap_sync
  image: docker.packages.bethel.jw.org/python:3.9
  tags:
    - linux-k8s-onprem
  script:
    - pip install requests ldap3
    - python custom_scripts/ldap_sync.py
  only:
    - schedules
