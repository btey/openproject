stages:
  - ldap_sync
  - extract_version
  - build
  - publish
  - deploy_defaults
  - deploy_dev
  - deploy_prod

include:
  - template: "Workflows/MergeRequest-Pipelines.gitlab-ci.yml"
  - project: tools/pipeline-templates
    ref: v3.1.1
    file: generic/token.yml

variables:
  VAULT_ADDR: https://vault.o11n.jw-cd-gitlab.10aws.org

extract_version:
  stage: extract_version
  image: docker.packages.bethel.jw.org/python:3.9
  tags:
    - linux-k8s
  script:
    - pip install python-gitlab
    - python custom_scripts/get_version.py
  artifacts:
    reports:
      dotenv: version.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"

.build:
  stage: build
  image: docker.packages.bethel.jw.org/glue-builder:latest
  tags:
    - linux-k8s
  variables:
    CONTEXT_PATH: .
    BUILDER_COMMAND: build
    DOCKERFILE_PATH: docker/prod/Dockerfile-slim
    IMAGE_NAME: openproject-slim
    BIM_SUPPORT: false
    TAG: $CI_COMMIT_SHA
  script:
    - echo "Tag version is $TAG"
    - echo "App version is $APP_VERSION"
    - glue-buildah --verbosity 2 --tag "$APP_VERSION"

build-image-slim:
  extends: .build
  variables:
      DOCKERFILE_PATH: docker/prod/Dockerfile-slim
      IMAGE_NAME: openproject-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"

